<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Match {{.ID}}</title>
  <script src="/static/vendor/htmx.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.js", "three/addons/": "/static/vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: #eee; font-family: sans-serif; }
    #scene-root, #overlay { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #overlay { pointer-events: auto; }
    #hud { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10; text-align: center; }
    #hud button { pointer-events: auto; }
  </style>
</head>
<body>
  <div id="scene-root"></div>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <span id="status">Connecting…</span>
    <button hx-post="/matches/{{.ID}}/start" hx-swap="none">Start</button>
  </div>
  <script>window.MATCH = { id: {{.ID}}, name: {{.Name}} };</script>
  <script type="module" src="/static/game3d.js"></script>
</body>
</html>
