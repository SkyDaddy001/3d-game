<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Match {{.ID}}</title>
  <script src="/static/vendor/htmx.min.js"></script>
  <script type="importmap">
    { "imports": { "three": "/static/vendor/three.module.js", "three/addons/": "/static/vendor/addons/" } }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; color: #fff; font-family: ui-rounded, system-ui, sans-serif; }
    #scene-root, #overlay, #vignette { position: fixed; inset: 0; width: 100vw; height: 100vh; }
    #vignette { pointer-events: none; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(10,14,30,0.38) 100%); }
    #overlay { pointer-events: auto; }
    #hud { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 12px; align-items: center;
           font: 700 13px ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1px; text-transform: uppercase; color: #eaffff;
           background: rgba(6,16,30,0.66); padding: 9px 22px; border: 1.5px solid rgba(111,243,255,0.38);
           clip-path: polygon(12px 0, 100% 0, calc(100% - 12px) 100%, 0 100%); text-shadow: 0 0 8px rgba(111,243,255,0.7); white-space: nowrap; }
    #hud button, #hud a { pointer-events: auto; border: 0; padding: 5px 16px; font: inherit; color: #06202a;
           background: #6ff3ff; text-decoration: none; cursor: pointer; text-shadow: none; box-shadow: 0 0 12px rgba(111,243,255,0.6); }
    [hidden] { display: none !important; }
    body.capture #hud button, body.capture #hud a { display: none; }
  </style>
</head>
<body>
  <div id="scene-root"></div>
  <div id="vignette"></div>
  <canvas id="overlay"></canvas>
  <div id="hud">
    <span id="status">Connecting…</span>
    {{if .Replay}}
    <button id="rp-prev" title="Previous player">◀</button>
    <button id="rp-pause" title="Pause or play">⏯</button>
    <button id="rp-next" title="Next player">▶</button>
    <button id="rp-speed" title="Change speed">Speed</button>
    <button id="rp-restart" title="Start again">↺</button>
    {{end}}
    <button id="start" hx-post="/matches/{{.ID}}/start" hx-swap="none"{{if .Replay}} hidden{{end}}>Start</button>
    <button id="again" hx-post="/matches/quick" hx-swap="none" hidden>Play again</button>
    <a id="back" href="/" hidden>Lobby</a>
  </div>
  <script>window.MATCH = { id: {{.ID}}, name: {{.Name}}, replay: {{.Replay}} };</script>
  <script type="module" src="/static/game3d.js"></script>
</body>
</html>
