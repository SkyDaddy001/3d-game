{{range .}}
<div class="row-item">
  <span>Match {{.ID}} <span class="small">· {{.Players}} players</span></span>
  {{if .Started}}<span class="pill live">In progress</span>{{else}}<span><span class="pill open">Open</span> <button hx-post="/matches/{{.ID}}/join" hx-swap="none">Join</button></span>{{end}}
</div>
{{else}}
<p class="empty">No matches yet. Press Play to start one.</p>
{{end}}
